name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            runner: [tart]
          - platform: Linux
            runner: [self-hosted, linux, x64]
          - platform: Windows
            runner: [self-hosted, windows, x64]
    name: Android CLI / ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Setup Android SDK
        uses: premex-ab/setup-android-cli@35c853708c8a6981651bb0060a17e01fac0143b1 # v1.1.0
        with:
          packages: |
            platform-tools
            platforms/android-35
            build-tools/34.0.0

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        if: runner.os != 'Windows'
        working-directory: sdk-20
        run: ./gradlew --no-daemon assembleDebug

      - name: Build (Windows)
        shell: pwsh
        if: runner.os == 'Windows'
        working-directory: sdk-20
        run: .\gradlew.bat --no-daemon assembleDebug

  CI:
    needs: build
    if: always()
    runs-on: tart
    steps:
      - run: |
          if [[ "${{ needs.build.result }}" != "success" ]]; then
            exit 1
          fi
